services:

  postgres:
    image: postgres:16
    container_name: ai-platform-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - ai-platform-network


  redis:
    image: redis:7
    container_name: ai-platform-redis

    command:
      - redis-server
      - --appendonly
      - "yes"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - ai-platform-network


  deployment-controller:
    build:
      context: ./deployment-controller

    container_name: ai-deployment-controller

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - ai-platform-network


  platform-api:
    build:
      context: ./platform-api

    container_name: ai-platform-api

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - ai-platform-network


volumes:

  postgres_data:

  redis_data:


networks:

  ai-platform-network:
    driver: bridge
